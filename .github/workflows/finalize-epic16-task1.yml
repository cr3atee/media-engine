name: Finalize EPIC 16 Task 1

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediaengine_final
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediaengine_final"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mediaengine_final
      MEDIAENGINE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mediaengine_final
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - name: Run final verification suite
        run: |
          set +e
          {
            EPIC16_FILES=$(python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/ci.yml').read_text())
          print(workflow['jobs']['quality']['env']['EPIC16_FILES'])
          PY
            )
            uv run ruff check $EPIC16_FILES
            uv run ruff format --check $EPIC16_FILES
            uv run mypy --explicit-package-bases $EPIC16_FILES
            uv run alembic upgrade head
            uv run alembic current
            uv run pytest
            uv run alembic downgrade base
            uv run python scripts/verify_epic16_tenant_foundation.py
            uv run python scripts/verify_epic16_parent_consistency.py
          } > /tmp/epic16-final.log 2>&1
          status=$?
          echo "$status" > /tmp/epic16-final.status
          cat /tmp/epic16-final.log
          exit 0
      - name: Persist verification result and self-clean
        run: |
          git pull --rebase origin agent/epic16-tenant-foundation
          status=$(cat /tmp/epic16-final.status)
          rm -f .github/workflows/apply-parent-quality.yml
          rm -f .github/workflows/finalize-parent-quality.yml
          rm -f .github/workflows/finalize-epic16-task1.yml
          if [ "$status" = "0" ]; then
            rm -f .github/EPIC_16_TASK_1_FAILURE.log
            cat > docs/EPIC_16_TASK_1_VERIFICATION.md <<'EOF'
          # EPIC 16 Task 1 Verification

          Status: PASSED

          Verified on GitHub Actions with Python 3.13 and PostgreSQL 17.

          The final verification suite passed:

          - Ruff lint for the EPIC 16 scope
          - Ruff formatting check
          - MyPy for the EPIC 16 scope
          - Alembic upgrade to migration head
          - Full Pytest suite
          - Alembic downgrade to base
          - Legacy tenant seed and deterministic backfill verification
          - Tenant-scoped offer and snapshot identity verification
          - Migration downgrade and re-upgrade verification
          - Cross-tenant parent/child consistency verification for prices,
            offers, events, generated content, and publications

          The pull request remains draft and must not be merged without an
          explicit review decision.
          EOF
            commit_message="docs(epic16): record task 1 verification"
          else
            mkdir -p .github
            {
              echo "EPIC 16 Task 1 final verification failed."
              echo
              tail -n 500 /tmp/epic16-final.log
            } > .github/EPIC_16_TASK_1_FAILURE.log
            commit_message="ci(epic16): record task 1 verification failure"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "$commit_message"
          git push origin HEAD:agent/epic16-tenant-foundation
