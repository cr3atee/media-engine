name: Apply Direct Tenant Consistency Models

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - name: Apply direct ORM constraints
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text()
              if old not in content:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              file_path.write_text(content.replace(old, new, 1))

          replace(
              "app/models/product.py",
              "from sqlalchemy import ForeignKey, Index, String, Uuid\n",
              "from sqlalchemy import ForeignKey, Index, String, UniqueConstraint, Uuid\n",
          )
          replace(
              "app/models/product.py",
              '''    __table_args__ = (
                  Index(
                      "uq_products_tenant_marketplace_external_id",
                      "tenant_id",
                      "marketplace_id",
                      "external_id",
                      unique=True,
                  ),
              )
          ''',
              '''    __table_args__ = (
                  UniqueConstraint("id", "tenant_id", name="uq_products_id_tenant"),
                  Index(
                      "uq_products_tenant_marketplace_external_id",
                      "tenant_id",
                      "marketplace_id",
                      "external_id",
                      unique=True,
                  ),
              )
          ''',
          )

          replace(
              "app/models/price.py",
              "from sqlalchemy import ForeignKey, Index, Numeric, String, Uuid\n",
              "from sqlalchemy import (\n"
              "    ForeignKey,\n"
              "    ForeignKeyConstraint,\n"
              "    Index,\n"
              "    Numeric,\n"
              "    String,\n"
              "    Uuid,\n"
              ")\n",
          )
          replace(
              "app/models/price.py",
              '''    __table_args__ = (
                  Index("ix_prices_tenant_product_collected", "tenant_id", "product_id", "collected_at"),
              )
          ''',
              '''    __table_args__ = (
                  ForeignKeyConstraint(
                      ("product_id", "tenant_id"),
                      ("products.id", "products.tenant_id"),
                      name="fk_prices_product_tenant",
                      ondelete="RESTRICT",
                  ),
                  Index(
                      "ix_prices_tenant_product_collected",
                      "tenant_id",
                      "product_id",
                      "collected_at",
                  ),
              )
          ''',
          )

          replace(
              "app/models/canonical_product_record.py",
              "from sqlalchemy import JSON, DateTime, ForeignKey, Index, String, Uuid\n",
              "from sqlalchemy import (\n"
              "    JSON,\n"
              "    DateTime,\n"
              "    ForeignKey,\n"
              "    Index,\n"
              "    String,\n"
              "    UniqueConstraint,\n"
              "    Uuid,\n"
              ")\n",
          )
          replace(
              "app/models/canonical_product_record.py",
              '''    __table_args__ = (
                  Index("ix_canonical_products_tenant_name", "tenant_id", "name"),
              )
          ''',
              '''    __table_args__ = (
                  UniqueConstraint(
                      "id",
                      "tenant_id",
                      name="uq_canonical_products_id_tenant",
                  ),
                  Index("ix_canonical_products_tenant_name", "tenant_id", "name"),
              )
          ''',
          )

          replace(
              "app/models/price_snapshot_record.py",
              '''    __table_args__ = (
                  UniqueConstraint(
                      "tenant_id",
          ''',
              '''    __table_args__ = (
                  UniqueConstraint(
                      "id",
                      "tenant_id",
                      name="uq_price_snapshots_id_tenant",
                  ),
                  UniqueConstraint(
                      "tenant_id",
          ''',
          )

          replace(
              "app/models/market_event_record.py",
              '''    __table_args__ = (
                  PrimaryKeyConstraint("id", name="pk_market_events"),
                  UniqueConstraint(
                      "tenant_id",
          ''',
              '''    __table_args__ = (
                  PrimaryKeyConstraint("id", name="pk_market_events"),
                  UniqueConstraint(
                      "id",
                      "tenant_id",
                      name="uq_market_events_id_tenant",
                  ),
                  UniqueConstraint(
                      "tenant_id",
          ''',
          )
          replace(
              "app/models/market_event_record.py",
              '''        ForeignKeyConstraint(
                      ("current_snapshot_id",),
                      ("price_snapshots.id",),
                      name="fk_market_events_current_snapshot",
                      ondelete="RESTRICT",
                  ),
                  CheckConstraint(
          ''',
              '''        ForeignKeyConstraint(
                      ("current_snapshot_id",),
                      ("price_snapshots.id",),
                      name="fk_market_events_current_snapshot",
                      ondelete="RESTRICT",
                  ),
                  ForeignKeyConstraint(
                      ("previous_snapshot_id", "tenant_id"),
                      ("price_snapshots.id", "price_snapshots.tenant_id"),
                      name="fk_market_events_previous_snapshot_tenant",
                      ondelete="RESTRICT",
                  ),
                  ForeignKeyConstraint(
                      ("current_snapshot_id", "tenant_id"),
                      ("price_snapshots.id", "price_snapshots.tenant_id"),
                      name="fk_market_events_current_snapshot_tenant",
                      ondelete="RESTRICT",
                  ),
                  CheckConstraint(
          ''',
          )

          replace(
              "app/models/generated_content_record.py",
              '''    __table_args__ = (
                  PrimaryKeyConstraint("id", name="pk_generated_contents"),
                  UniqueConstraint(
                      "tenant_id",
          ''',
              '''    __table_args__ = (
                  PrimaryKeyConstraint("id", name="pk_generated_contents"),
                  UniqueConstraint(
                      "id",
                      "tenant_id",
                      name="uq_generated_contents_id_tenant",
                  ),
                  UniqueConstraint(
                      "tenant_id",
          ''',
          )
          replace(
              "app/models/generated_content_record.py",
              '''        ForeignKeyConstraint(
                      ("parent_content_id",),
                      ("generated_contents.id",),
                      name="fk_generated_contents_parent",
                      ondelete="RESTRICT",
                  ),
                  CheckConstraint(
          ''',
              '''        ForeignKeyConstraint(
                      ("parent_content_id",),
                      ("generated_contents.id",),
                      name="fk_generated_contents_parent",
                      ondelete="RESTRICT",
                  ),
                  ForeignKeyConstraint(
                      ("event_id", "tenant_id"),
                      ("market_events.id", "market_events.tenant_id"),
                      name="fk_generated_contents_event_tenant",
                      ondelete="RESTRICT",
                  ),
                  ForeignKeyConstraint(
                      ("parent_content_id", "tenant_id"),
                      ("generated_contents.id", "generated_contents.tenant_id"),
                      name="fk_generated_contents_parent_tenant",
                      ondelete="RESTRICT",
                  ),
                  CheckConstraint(
          ''',
          )

          replace(
              "app/models/publication_record.py",
              '''        ForeignKeyConstraint(
                      ("content_id",),
                      ("generated_contents.id",),
                      name="fk_publications_content",
                      ondelete="RESTRICT",
                  ),
                  CheckConstraint(
          ''',
              '''        ForeignKeyConstraint(
                      ("content_id",),
                      ("generated_contents.id",),
                      name="fk_publications_content",
                      ondelete="RESTRICT",
                  ),
                  ForeignKeyConstraint(
                      ("event_id", "tenant_id"),
                      ("market_events.id", "market_events.tenant_id"),
                      name="fk_publications_event_tenant",
                      ondelete="RESTRICT",
                  ),
                  ForeignKeyConstraint(
                      ("content_id", "tenant_id"),
                      ("generated_contents.id", "generated_contents.tenant_id"),
                      name="fk_publications_content_tenant",
                      ondelete="RESTRICT",
                  ),
                  CheckConstraint(
          ''',
          )
          PY
      - name: Format and validate models
        run: |
          files=(
            app/models/product.py
            app/models/price.py
            app/models/canonical_product_record.py
            app/models/price_snapshot_record.py
            app/models/market_event_record.py
            app/models/generated_content_record.py
            app/models/publication_record.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run mypy --explicit-package-bases "${files[@]}"
      - name: Commit and push model constraints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/models
          git diff --cached --quiet && exit 0
          git commit -m "feat(epic16): mirror tenant parent constraints in ORM"
          git push origin HEAD:agent/epic16-tenant-foundation
