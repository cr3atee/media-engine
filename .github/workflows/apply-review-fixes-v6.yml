name: Apply Fully Normalized EPIC 16 Review Fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - name: Execute fully normalized protected patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          workflow = Path('.github/workflows/apply-review-fixes.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )

          expected: dict[str, str] = {}
          for node in ast.walk(ast.parse(script)):
              if not isinstance(node, ast.Call) or len(node.args) < 3:
                  continue
              path_arg, old_arg = node.args[0], node.args[1]
              if not isinstance(path_arg, ast.Constant) or not isinstance(old_arg, ast.Constant):
                  continue
              if not isinstance(path_arg.value, str) or not isinstance(old_arg.value, str):
                  continue
              if (
                  path_arg.value == 'app/repositories/postgres/postgres_publications.py'
                  and 'PublicationRecord.content_id == command.content_id' in old_arg.value
                  and old_arg.value.lstrip().startswith('(')
              ):
                  expected['publication'] = old_arg.value
              if (
                  path_arg.value == 'app/domain/admin_actions.py'
                  and '"expected_version": expected_version' in old_arg.value
                  and '"metadata": normalized_metadata' in old_arg.value
              ):
                  expected['admin'] = old_arg.value
          if set(expected) != {'publication', 'admin'}:
              raise SystemExit(f'Missing expected AST blocks: {sorted(expected)}')

          publication_path = Path('app/repositories/postgres/postgres_publications.py')
          publication_content = publication_path.read_text()
          publication_pattern = re.compile(
              r"                    \(\n"
              r"\s*\(PublicationRecord\.content_id == command\.content_id\)\n"
              r"\s*& \(PublicationRecord\.channel == command\.channel\)\n"
              r"\s*& \(PublicationRecord\.destination_key == command\.destination_key\)\n"
              r"\s*\),\n"
          )
          publication_content, publication_count = publication_pattern.subn(
              expected['publication'],
              publication_content,
              count=1,
          )
          if publication_count != 1:
              raise SystemExit(
                  f'Publication normalization count: {publication_count}'
              )
          publication_path.write_text(publication_content)

          admin_path = Path('app/domain/admin_actions.py')
          admin_content = admin_path.read_text()
          admin_pattern = re.compile(
              r'        "expected_version": expected_version,\n'
              r'\s*"metadata": normalized_metadata,\n'
              r'\s*"reason": normalize_optional_reason\(reason\),\n'
              r'\s*"resource_id": str\(resource_id\),\n'
              r'\s*"resource_type": resource_type\.value,\n'
              r'\s*}\n'
          )
          admin_content, admin_count = admin_pattern.subn(
              expected['admin'],
              admin_content,
              count=1,
          )
          if admin_count != 1:
              raise SystemExit(f'Admin normalization count: {admin_count}')
          admin_path.write_text(admin_content)

          exec(compile(script, 'embedded-review-fixes-v6', 'exec'))

          publication_content = publication_path.read_text()
          tenant_import = 'from app.domain.tenancy import LEGACY_TENANT_ID\n'
          if tenant_import not in publication_content:
              model_import = 'from app.models.publication_record import PublicationRecord\n'
              if model_import not in publication_content:
                  raise SystemExit('Publication model import marker was not found')
              publication_content = publication_content.replace(
                  model_import,
                  tenant_import + model_import,
                  1,
              )
              publication_path.write_text(publication_content)
          PY
      - name: Format and validate changed files
        run: |
          files=(
            app/domain/admin_actions.py
            app/domain/generated_content.py
            app/domain/publications.py
            app/repositories/events.py
            app/repositories/memory/memory_events.py
            app/repositories/postgres/postgres_events.py
            app/repositories/postgres/postgres_generated_contents.py
            app/repositories/publications.py
            app/repositories/memory/memory_publications.py
            app/repositories/postgres/postgres_publications.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run mypy --explicit-package-bases "${files[@]}"
      - name: Commit and push reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/domain app/repositories
          git diff --cached --quiet && exit 0
          git commit -m "fix(epic16): close tenant identity lookup gaps"
          git push origin HEAD:agent/epic16-tenant-foundation
