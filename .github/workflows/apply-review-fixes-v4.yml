name: Apply Normalized EPIC 16 Review Fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - name: Normalize one protected source block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/repositories/postgres/postgres_publications.py')
          content = path.read_text()
          pattern = re.compile(
              r"                    \(\n"
              r"\s*\(PublicationRecord\.content_id == command\.content_id\)\n"
              r"\s*& \(PublicationRecord\.channel == command\.channel\)\n"
              r"\s*& \(PublicationRecord\.destination_key == command\.destination_key\)\n"
              r"\s*\),"
          )
          normalized = '''                    (
                (PublicationRecord.content_id == command.content_id)
                & (PublicationRecord.channel == command.channel)
                & (PublicationRecord.destination_key == command.destination_key)
            ),'''
          content, count = pattern.subn(normalized, content, count=1)
          if count != 1:
              raise SystemExit(f'Publication block normalization count: {count}')
          path.write_text(content)
          PY
      - name: Execute original protected patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-review-fixes.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )
          exec(compile(script, 'embedded-review-fixes-v4', 'exec'))
          PY
      - name: Format and validate changed files
        run: |
          files=(
            app/domain/admin_actions.py
            app/domain/generated_content.py
            app/domain/publications.py
            app/repositories/events.py
            app/repositories/memory/memory_events.py
            app/repositories/postgres/postgres_events.py
            app/repositories/postgres/postgres_generated_contents.py
            app/repositories/publications.py
            app/repositories/memory/memory_publications.py
            app/repositories/postgres/postgres_publications.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
      - name: Commit and push reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/domain app/repositories
          git diff --cached --quiet && exit 0
          git commit -m "fix(epic16): close tenant identity lookup gaps"
          git push origin HEAD:agent/epic16-tenant-foundation
