name: Apply Finalized Tenant Consistency Models

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - name: Apply finalized ORM constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          workflow = Path(
              '.github/workflows/apply-tenant-consistency-models.yml'
          ).read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )

          skipped_paths = {
              'app/models/canonical_product_record.py',
              'app/models/generated_content_record.py',
          }
          module = ast.parse(script)
          filtered: list[ast.stmt] = []
          for statement in module.body:
              if isinstance(statement, ast.Expr) and isinstance(statement.value, ast.Call):
                  call = statement.value
                  if (
                      isinstance(call.func, ast.Name)
                      and call.func.id == 'replace'
                      and call.args
                      and isinstance(call.args[0], ast.Constant)
                      and call.args[0].value in skipped_paths
                  ):
                      continue
              filtered.append(statement)
          module.body = filtered
          ast.fix_missing_locations(module)
          exec(compile(module, 'tenant-consistency-models-v3', 'exec'))

          canonical_path = Path('app/models/canonical_product_record.py')
          canonical = canonical_path.read_text()
          old_import = (
              'from sqlalchemy import JSON, DateTime, ForeignKey, Index, String, Uuid\n'
          )
          new_import = (
              'from sqlalchemy import (\n'
              '    JSON,\n'
              '    DateTime,\n'
              '    ForeignKey,\n'
              '    Index,\n'
              '    String,\n'
              '    UniqueConstraint,\n'
              '    Uuid,\n'
              ')\n'
          )
          if old_import not in canonical:
              raise SystemExit('Canonical product import marker not found')
          canonical = canonical.replace(old_import, new_import, 1)
          old_args = '''    __table_args__ = (
              Index("ix_canonical_products_tenant_name", "tenant_id", "name"),
          )
          '''
          new_args = '''    __table_args__ = (
              UniqueConstraint(
                  "id",
                  "tenant_id",
                  name="uq_canonical_products_id_tenant",
              ),
              Index("ix_canonical_products_tenant_name", "tenant_id", "name"),
          )
          '''
          if old_args not in canonical:
              raise SystemExit('Canonical product table args marker not found')
          canonical_path.write_text(canonical.replace(old_args, new_args, 1))

          generated_path = Path('app/models/generated_content_record.py')
          generated = generated_path.read_text()
          pk_marker = '''        PrimaryKeyConstraint("id", name="pk_generated_contents"),
          '''
          pk_replacement = '''        PrimaryKeyConstraint("id", name="pk_generated_contents"),
                  UniqueConstraint(
                      "id",
                      "tenant_id",
                      name="uq_generated_contents_id_tenant",
                  ),
          '''
          if pk_marker not in generated:
              raise SystemExit('Generated content primary-key marker not found')
          generated = generated.replace(pk_marker, pk_replacement, 1)
          parent_fk = '''        ForeignKeyConstraint(
                      ("parent_content_id",),
                      ("generated_contents.id",),
                      name="fk_generated_contents_parent",
                      ondelete="RESTRICT",
                  ),
          '''
          composite_fks = parent_fk + '''        ForeignKeyConstraint(
                      ("event_id", "tenant_id"),
                      ("market_events.id", "market_events.tenant_id"),
                      name="fk_generated_contents_event_tenant",
                      ondelete="RESTRICT",
                  ),
                  ForeignKeyConstraint(
                      ("parent_content_id", "tenant_id"),
                      ("generated_contents.id", "generated_contents.tenant_id"),
                      name="fk_generated_contents_parent_tenant",
                      ondelete="RESTRICT",
                  ),
          '''
          if parent_fk not in generated:
              raise SystemExit('Generated content parent-FK marker not found')
          generated_path.write_text(generated.replace(parent_fk, composite_fks, 1))
          PY
      - name: Format and validate models
        run: |
          files=(
            app/models/product.py
            app/models/price.py
            app/models/canonical_product_record.py
            app/models/price_snapshot_record.py
            app/models/market_event_record.py
            app/models/generated_content_record.py
            app/models/publication_record.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run mypy --explicit-package-bases "${files[@]}"
      - name: Commit and push model constraints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/models
          git diff --cached --quiet && exit 0
          git commit -m "feat(epic16): mirror tenant parent constraints in ORM"
          git push origin HEAD:agent/epic16-tenant-foundation
