name: Apply Corrected Tenant Consistency Models

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - name: Apply corrected ORM constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          workflow = Path(
              '.github/workflows/apply-tenant-consistency-models.yml'
          ).read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )

          module = ast.parse(script)
          filtered: list[ast.stmt] = []
          for statement in module.body:
              if isinstance(statement, ast.Expr) and isinstance(statement.value, ast.Call):
                  call = statement.value
                  if (
                      isinstance(call.func, ast.Name)
                      and call.func.id == 'replace'
                      and call.args
                      and isinstance(call.args[0], ast.Constant)
                      and call.args[0].value == 'app/models/canonical_product_record.py'
                  ):
                      continue
              filtered.append(statement)
          module.body = filtered
          ast.fix_missing_locations(module)
          exec(compile(module, 'tenant-consistency-models-v2', 'exec'))

          path = Path('app/models/canonical_product_record.py')
          content = path.read_text()
          old_import = (
              'from sqlalchemy import JSON, DateTime, ForeignKey, Index, String, Uuid\n'
          )
          new_import = (
              'from sqlalchemy import (\n'
              '    JSON,\n'
              '    DateTime,\n'
              '    ForeignKey,\n'
              '    Index,\n'
              '    String,\n'
              '    UniqueConstraint,\n'
              '    Uuid,\n'
              ')\n'
          )
          if old_import not in content:
              raise SystemExit('Canonical product import marker not found')
          content = content.replace(old_import, new_import, 1)
          old_args = '''    __table_args__ = (
              Index("ix_canonical_products_tenant_name", "tenant_id", "name"),
          )
          '''
          new_args = '''    __table_args__ = (
              UniqueConstraint(
                  "id",
                  "tenant_id",
                  name="uq_canonical_products_id_tenant",
              ),
              Index("ix_canonical_products_tenant_name", "tenant_id", "name"),
          )
          '''
          if old_args not in content:
              raise SystemExit('Canonical product table args marker not found')
          path.write_text(content.replace(old_args, new_args, 1))
          PY
      - name: Format and validate models
        run: |
          files=(
            app/models/product.py
            app/models/price.py
            app/models/canonical_product_record.py
            app/models/price_snapshot_record.py
            app/models/market_event_record.py
            app/models/generated_content_record.py
            app/models/publication_record.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run mypy --explicit-package-bases "${files[@]}"
      - name: Commit and push model constraints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/models
          git diff --cached --quiet && exit 0
          git commit -m "feat(epic16): mirror tenant parent constraints in ORM"
          git push origin HEAD:agent/epic16-tenant-foundation
