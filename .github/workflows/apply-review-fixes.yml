name: Apply EPIC 16 Review Fixes

on:
  push:
    branches:
      - agent/epic16-tenant-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - name: Apply reviewed tenant-isolation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text()
              if old not in content:
                  raise SystemExit(f"Expected block not found in {path}: {old[:80]!r}")
              file_path.write_text(content.replace(old, new, 1))

          replace(
              "app/domain/generated_content.py",
              '''    return hash_identity_fields(
                  str(tenant_id),
                  str(event_id),
                  _normalize_code(content_type, field_name="content_type"),
                  _normalize_code(language, field_name="language"),
                  _require_text(prompt_version, field_name="prompt_version"),
                  str(attempt_number),
              )
          ''',
              '''    identity_fields = (
                  str(event_id),
                  _normalize_code(content_type, field_name="content_type"),
                  _normalize_code(language, field_name="language"),
                  _require_text(prompt_version, field_name="prompt_version"),
                  str(attempt_number),
              )
              if tenant_id != LEGACY_TENANT_ID:
                  identity_fields = (str(tenant_id), *identity_fields)
              return hash_identity_fields(*identity_fields)
          ''',
          )

          replace(
              "app/domain/publications.py",
              '''    return hash_identity_fields(
                  str(tenant_id),
                  str(event_id),
                  str(content_id),
                  _normalize_channel(channel),
                  _require_text(destination_key, field_name="destination_key"),
              )
          ''',
              '''    identity_fields = (
                  str(event_id),
                  str(content_id),
                  _normalize_channel(channel),
                  _require_text(destination_key, field_name="destination_key"),
              )
              if tenant_id != LEGACY_TENANT_ID:
                  identity_fields = (str(tenant_id), *identity_fields)
              return hash_identity_fields(*identity_fields)
          ''',
          )

          replace(
              "app/repositories/events.py",
              '''from app.domain.processing import ProcessingError, StateTransitionResult
          from app.repositories.base import BaseRepository
          ''',
              '''from app.domain.processing import ProcessingError, StateTransitionResult
          from app.domain.tenancy import LEGACY_TENANT_ID
          from app.repositories.base import BaseRepository
          ''',
          )
          replace(
              "app/repositories/events.py",
              '''    @abstractmethod
              async def get_by_identity(
                  self,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return a market event by deterministic identity."""
          ''',
              '''    @abstractmethod
              async def get_by_identity(
                  self,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return a legacy-tenant event by deterministic identity."""

              async def get_by_identity_for_tenant(
                  self,
                  tenant_id: UUID,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return a market event by tenant and deterministic identity."""
                  if tenant_id == LEGACY_TENANT_ID:
                      return await self.get_by_identity(identity_key)
                  msg = (
                      f"{type(self).__name__} does not implement tenant-scoped "
                      "event identity lookup."
                  )
                  raise NotImplementedError(msg)
          ''',
          )

          replace(
              "app/repositories/memory/memory_events.py",
              '''from app.domain.processing import (
              IdempotentCreateStatus,
              ProcessingError,
              StateTransitionOutcome,
              StateTransitionResult,
              WorkClaim,
          )
          from app.repositories.base import RepositoryIdentityConflictError
          ''',
              '''from app.domain.processing import (
              IdempotentCreateStatus,
              ProcessingError,
              StateTransitionOutcome,
              StateTransitionResult,
              WorkClaim,
          )
          from app.domain.tenancy import LEGACY_TENANT_ID
          from app.repositories.base import RepositoryIdentityConflictError
          ''',
          )
          replace(
              "app/repositories/memory/memory_events.py",
              '''    async def get_by_identity(
                  self,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return one immutable event snapshot by deterministic identity."""
                  for event_id in self._event_ids_by_identity.values():
                      event = self._events_by_id[event_id]
                      if event.identity_key == identity_key:
                          return event
                  return None
          ''',
              '''    async def get_by_identity(
                  self,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return one legacy-tenant event by deterministic identity."""
                  return await self.get_by_identity_for_tenant(
                      LEGACY_TENANT_ID,
                      identity_key,
                  )

              async def get_by_identity_for_tenant(
                  self,
                  tenant_id: UUID,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return one event by tenant and deterministic identity."""
                  event_id = self._event_ids_by_identity.get((tenant_id, identity_key))
                  return self._events_by_id.get(event_id) if event_id is not None else None
          ''',
          )

          replace(
              "app/repositories/postgres/postgres_events.py",
              '''from app.domain.processing import (
              IdempotentCreateStatus,
              ProcessingError,
              StateTransitionOutcome,
              StateTransitionResult,
              WorkClaim,
          )
          from app.models.market_event_record import MarketEventRecord
          ''',
              '''from app.domain.processing import (
              IdempotentCreateStatus,
              ProcessingError,
              StateTransitionOutcome,
              StateTransitionResult,
              WorkClaim,
          )
          from app.domain.tenancy import LEGACY_TENANT_ID
          from app.models.market_event_record import MarketEventRecord
          ''',
          )
          replace(
              "app/repositories/postgres/postgres_events.py",
              '''    async def get_by_identity(
                  self,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return one immutable event snapshot by deterministic identity."""
                  row = await self._get_event_row(
                      self._event_query().where(
                          MarketEventRecord.identity_key == identity_key,
                      ),
                  )
                  return self._map_row(row) if row is not None else None
          ''',
              '''    async def get_by_identity(
                  self,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return one legacy-tenant event by deterministic identity."""
                  return await self.get_by_identity_for_tenant(
                      LEGACY_TENANT_ID,
                      identity_key,
                  )

              async def get_by_identity_for_tenant(
                  self,
                  tenant_id: UUID,
                  identity_key: str,
              ) -> PriceDropMarketEvent | None:
                  """Return one event by tenant and deterministic identity."""
                  row = await self._get_event_row(
                      self._event_query().where(
                          MarketEventRecord.tenant_id == tenant_id,
                          MarketEventRecord.identity_key == identity_key,
                      ),
                  )
                  return self._map_row(row) if row is not None else None
          ''',
          )

          replace(
              "app/repositories/postgres/postgres_generated_contents.py",
              '''        existing = await self._get_by_key(command.idempotency_key)
          ''',
              '''        existing = await self._get_by_key(
                      command.tenant_id,
                      command.idempotency_key,
                  )
          ''',
          )
          replace(
              "app/repositories/postgres/postgres_generated_contents.py",
              '''    async def _get_by_key(self, key: str) -> GeneratedContentAttempt | None:
                  result = await self._session.execute(
                      select(GeneratedContentRecord).where(
                          GeneratedContentRecord.idempotency_key == key
                      )
                  )
                  record = result.scalar_one_or_none()
                  return _to_domain(record) if record is not None else None
          ''',
              '''    async def _get_by_key(
                  self,
                  tenant_id: UUID,
                  key: str,
              ) -> GeneratedContentAttempt | None:
                  result = await self._session.execute(
                      select(GeneratedContentRecord).where(
                          GeneratedContentRecord.tenant_id == tenant_id,
                          GeneratedContentRecord.idempotency_key == key,
                      )
                  )
                  record = result.scalar_one_or_none()
                  return _to_domain(record) if record is not None else None
          ''',
          )

          replace(
              "app/repositories/publications.py",
              '''from app.domain.publications import (
              ClaimedPublication,
              CreatePublication,
              Publication,
              PublicationCreateResult,
          )
          from app.repositories.base import BaseRepository
          ''',
              '''from app.domain.publications import (
              ClaimedPublication,
              CreatePublication,
              Publication,
              PublicationCreateResult,
          )
          from app.domain.tenancy import LEGACY_TENANT_ID
          from app.repositories.base import BaseRepository
          ''',
          )
          replace(
              "app/repositories/publications.py",
              '''    @abstractmethod
              async def get_by_idempotency_key(
                  self,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return a publication by deterministic delivery identity."""
          ''',
              '''    @abstractmethod
              async def get_by_idempotency_key(
                  self,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return a legacy-tenant publication by delivery identity."""

              async def get_by_idempotency_key_for_tenant(
                  self,
                  tenant_id: UUID,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return a publication by tenant and delivery identity."""
                  if tenant_id == LEGACY_TENANT_ID:
                      return await self.get_by_idempotency_key(idempotency_key)
                  msg = (
                      f"{type(self).__name__} does not implement tenant-scoped "
                      "publication identity lookup."
                  )
                  raise NotImplementedError(msg)
          ''',
          )

          replace(
              "app/repositories/memory/memory_publications.py",
              '''from app.domain.publications import (
              ClaimedPublication,
              CreatePublication,
              Publication,
              PublicationCreateResult,
          )
          from app.repositories.base import RepositoryIdentityConflictError
          ''',
              '''from app.domain.publications import (
              ClaimedPublication,
              CreatePublication,
              Publication,
              PublicationCreateResult,
          )
          from app.domain.tenancy import LEGACY_TENANT_ID
          from app.repositories.base import RepositoryIdentityConflictError
          ''',
          )
          replace(
              "app/repositories/memory/memory_publications.py",
              '''        self._publication_ids_by_key: dict[str, UUID] = {}
          ''',
              '''        self._publication_ids_by_key: dict[tuple[UUID, str], UUID] = {}
          ''',
          )
          replace(
              "app/repositories/memory/memory_publications.py",
              '''        existing_id = self._publication_ids_by_key.get(command.idempotency_key)
          ''',
              '''        existing_id = self._publication_ids_by_key.get(
                      (command.tenant_id, command.idempotency_key)
                  )
          ''',
          )
          replace(
              "app/repositories/memory/memory_publications.py",
              '''    async def get_by_idempotency_key(
                  self,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return one immutable publication snapshot by delivery identity."""
                  publication_id = self._publication_ids_by_key.get(idempotency_key)
                  if publication_id is None:
                      return None
                  return self._publications_by_id[publication_id]
          ''',
              '''    async def get_by_idempotency_key(
                  self,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return one legacy-tenant publication by delivery identity."""
                  return await self.get_by_idempotency_key_for_tenant(
                      LEGACY_TENANT_ID,
                      idempotency_key,
                  )

              async def get_by_idempotency_key_for_tenant(
                  self,
                  tenant_id: UUID,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return one publication by tenant and delivery identity."""
                  publication_id = self._publication_ids_by_key.get(
                      (tenant_id, idempotency_key)
                  )
                  if publication_id is None:
                      return None
                  return self._publications_by_id[publication_id]
          ''',
          )
          replace(
              "app/repositories/memory/memory_publications.py",
              '''        self._publication_ids_by_key[publication.idempotency_key] = publication.id
          ''',
              '''        self._publication_ids_by_key[
                      (publication.tenant_id, publication.idempotency_key)
                  ] = publication.id
          ''',
          )

          replace(
              "app/repositories/postgres/postgres_publications.py",
              '''        existing = await self.get_by_idempotency_key(command.idempotency_key)
          ''',
              '''        existing = await self.get_by_idempotency_key_for_tenant(
                      command.tenant_id,
                      command.idempotency_key,
                  )
          ''',
          )
          replace(
              "app/repositories/postgres/postgres_publications.py",
              '''    async def get_by_idempotency_key(
                  self,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return one publication by deterministic delivery identity."""
                  result = await self._session.execute(
                      select(PublicationRecord).where(
                          PublicationRecord.idempotency_key == idempotency_key
                      )
                  )
                  record = result.scalar_one_or_none()
                  return _to_domain(record) if record is not None else None
          ''',
              '''    async def get_by_idempotency_key(
                  self,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return one legacy-tenant publication by delivery identity."""
                  return await self.get_by_idempotency_key_for_tenant(
                      LEGACY_TENANT_ID,
                      idempotency_key,
                  )

              async def get_by_idempotency_key_for_tenant(
                  self,
                  tenant_id: UUID,
                  idempotency_key: str,
              ) -> Publication | None:
                  """Return one publication by tenant and delivery identity."""
                  result = await self._session.execute(
                      select(PublicationRecord).where(
                          PublicationRecord.tenant_id == tenant_id,
                          PublicationRecord.idempotency_key == idempotency_key,
                      )
                  )
                  record = result.scalar_one_or_none()
                  return _to_domain(record) if record is not None else None
          ''',
          )
          replace(
              "app/repositories/postgres/postgres_publications.py",
              '''                    (
                          (PublicationRecord.content_id == command.content_id)
                          & (PublicationRecord.channel == command.channel)
                          & (PublicationRecord.destination_key == command.destination_key)
                      ),
          ''',
              '''                    (
                          (PublicationRecord.tenant_id == command.tenant_id)
                          & (PublicationRecord.content_id == command.content_id)
                          & (PublicationRecord.channel == command.channel)
                          & (PublicationRecord.destination_key == command.destination_key)
                      ),
          ''',
          )
          replace(
              "app/repositories/postgres/postgres_publications.py",
              '''    return {
                  "id": command.id,
                  "event_id": command.event_id,
          ''',
              '''    return {
                  "id": command.id,
                  "tenant_id": command.tenant_id,
                  "event_id": command.event_id,
          ''',
          )
          replace(
              "app/repositories/postgres/postgres_publications.py",
              '''    return Publication(
                  id=record.id,
                  event_id=record.event_id,
          ''',
              '''    return Publication(
                  id=record.id,
                  tenant_id=record.tenant_id,
                  event_id=record.event_id,
          ''',
          )

          replace(
              "app/domain/admin_actions.py",
              '''        "expected_version": expected_version,
                  "metadata": normalized_metadata,
                  "reason": normalize_optional_reason(reason),
                  "resource_id": str(resource_id),
                  "resource_type": resource_type.value,
              }
          ''',
              '''        "expected_version": expected_version,
              "metadata": normalized_metadata,
              "reason": normalize_optional_reason(reason),
              "resource_id": str(resource_id),
              "resource_type": resource_type.value,
          }
          ''',
          )
          PY
      - name: Format and validate changed files
        run: |
          uv run ruff format \
            app/domain/admin_actions.py \
            app/domain/generated_content.py \
            app/domain/publications.py \
            app/repositories/events.py \
            app/repositories/memory/memory_events.py \
            app/repositories/postgres/postgres_events.py \
            app/repositories/postgres/postgres_generated_contents.py \
            app/repositories/publications.py \
            app/repositories/memory/memory_publications.py \
            app/repositories/postgres/postgres_publications.py
          uv run ruff check \
            app/domain/admin_actions.py \
            app/domain/generated_content.py \
            app/domain/publications.py \
            app/repositories/events.py \
            app/repositories/memory/memory_events.py \
            app/repositories/postgres/postgres_events.py \
            app/repositories/postgres/postgres_generated_contents.py \
            app/repositories/publications.py \
            app/repositories/memory/memory_publications.py \
            app/repositories/postgres/postgres_publications.py
      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/domain/admin_actions.py \
            app/domain/generated_content.py \
            app/domain/publications.py \
            app/repositories/events.py \
            app/repositories/memory/memory_events.py \
            app/repositories/postgres/postgres_events.py \
            app/repositories/postgres/postgres_generated_contents.py \
            app/repositories/publications.py \
            app/repositories/memory/memory_publications.py \
            app/repositories/postgres/postgres_publications.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(epic16): close tenant identity lookup gaps"
          git push origin HEAD:agent/epic16-tenant-foundation
