name: EPIC 16 Review Patch Diagnostics

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - name: Execute protected replacement script without committing
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-review-fixes.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )
          exec(compile(script, 'embedded-review-fixes', 'exec'))
          PY
