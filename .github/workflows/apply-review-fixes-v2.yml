name: Apply Corrected EPIC 16 Review Fixes

on:
  push:
    branches:
      - agent/epic16-tenant-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - name: Apply corrected reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-review-fixes.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )

          bad_start_marker = (
              'replace(\n'
              '    "app/repositories/postgres/postgres_publications.py",\n'
              "    '''                    (\n"
          )
          bad_start = script.index(bad_start_marker)
          next_marker = (
              '\n\nreplace(\n'
              '    "app/repositories/postgres/postgres_publications.py",\n'
              "    '''    return {\n"
          )
          bad_end = script.index(next_marker, bad_start)
          script = script[:bad_start] + script[bad_end + 2:]
          exec(compile(script, 'embedded-review-fixes-v2', 'exec'))

          path = Path('app/repositories/postgres/postgres_publications.py')
          content = path.read_text()
          old = '''                    (
                          (PublicationRecord.content_id == command.content_id)
                          & (PublicationRecord.channel == command.channel)
                          & (PublicationRecord.destination_key == command.destination_key)
                      ),
          '''
          if old not in content:
              old = '''                    (
                              (PublicationRecord.content_id == command.content_id)
                              & (PublicationRecord.channel == command.channel)
                              & (PublicationRecord.destination_key == command.destination_key)
                          ),
          '''
          if old not in content:
              raise SystemExit('Corrected publication conflict block still not found')
          new = old.replace(
              '(PublicationRecord.content_id == command.content_id)',
              '(PublicationRecord.tenant_id == command.tenant_id)\n'
              '                        & (PublicationRecord.content_id == command.content_id)',
          )
          path.write_text(content.replace(old, new, 1))
          PY
      - name: Format and validate changed files
        run: |
          files=(
            app/domain/admin_actions.py
            app/domain/generated_content.py
            app/domain/publications.py
            app/repositories/events.py
            app/repositories/memory/memory_events.py
            app/repositories/postgres/postgres_events.py
            app/repositories/postgres/postgres_generated_contents.py
            app/repositories/publications.py
            app/repositories/memory/memory_publications.py
            app/repositories/postgres/postgres_publications.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/domain app/repositories
          git diff --cached --quiet && exit 0
          git commit -m "fix(epic16): close tenant identity lookup gaps"
          git push origin HEAD:agent/epic16-tenant-foundation
