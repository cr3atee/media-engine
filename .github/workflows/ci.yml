name: CI

on:
  push:
    branches:
      - agent/epic16-tenant-foundation
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      EPIC16_FILES: >-
        alembic/versions/0010_tenant_foundation.py
        alembic/versions/0011_tenant_parent_consistency.py
        app/domain/admin_actions.py
        app/domain/generated_content.py
        app/domain/market_events.py
        app/domain/price_snapshot.py
        app/domain/publications.py
        app/domain/tenancy.py
        app/models/admin_action_record.py
        app/models/canonical_product_record.py
        app/models/generated_content_record.py
        app/models/market_event_record.py
        app/models/price.py
        app/models/price_snapshot_record.py
        app/models/product.py
        app/models/publication_record.py
        app/models/tenant_membership_record.py
        app/models/tenant_record.py
        app/models/user_record.py
        app/parsers/models.py
        app/repositories/events.py
        app/repositories/generated_contents.py
        app/repositories/memberships.py
        app/repositories/offers.py
        app/repositories/price_history.py
        app/repositories/publications.py
        app/repositories/tenants.py
        app/repositories/users.py
        app/repositories/memory/memory_events.py
        app/repositories/memory/memory_generated_contents.py
        app/repositories/memory/memory_memberships.py
        app/repositories/memory/memory_offers.py
        app/repositories/memory/memory_price_history.py
        app/repositories/memory/memory_publications.py
        app/repositories/memory/memory_tenants.py
        app/repositories/memory/memory_users.py
        app/repositories/postgres/postgres_events.py
        app/repositories/postgres/postgres_generated_contents.py
        app/repositories/postgres/postgres_memberships.py
        app/repositories/postgres/postgres_offers.py
        app/repositories/postgres/postgres_price_history.py
        app/repositories/postgres/postgres_publications.py
        app/repositories/postgres/postgres_tenants.py
        app/repositories/postgres/postgres_users.py
        app/services/marketplace_pipeline.py
        scripts/verify_epic16_parent_consistency.py
        scripts/verify_epic16_tenant_foundation.py
        tests/domain/test_tenant_isolation.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Ruff EPIC 16 scope
        run: uv run ruff check $EPIC16_FILES
      - name: MyPy EPIC 16 scope
        run: uv run mypy --explicit-package-bases $EPIC16_FILES
      - name: Ruff format EPIC 16 scope
        run: uv run ruff format --diff $EPIC16_FILES

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediaengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediaengine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mediaengine_test
      MEDIAENGINE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mediaengine_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - run: uv run pytest

  tenant-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediaengine_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediaengine_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mediaengine_verify
      MEDIAENGINE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mediaengine_verify
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/verify_epic16_tenant_foundation.py
      - run: uv run python scripts/verify_epic16_parent_consistency.py
