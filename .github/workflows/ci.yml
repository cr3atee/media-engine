name: CI

on:
  push:
    branches:
      - agent/epic16-tenant-foundation
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts tests

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediaengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediaengine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mediaengine_test
      MEDIAENGINE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mediaengine_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - run: uv run pytest
