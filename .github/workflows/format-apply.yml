name: Apply EPIC 16 Formatting

on:
  push:
    branches:
      - agent/epic16-tenant-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic16-tenant-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - run: >-
          uv run ruff format
          alembic/versions/0010_tenant_foundation.py
          tests/domain/test_tenant_isolation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alembic/versions/0010_tenant_foundation.py tests/domain/test_tenant_isolation.py
          git diff --cached --quiet && exit 0
          git commit -m "style(epic16): apply Ruff formatting"
          git push origin HEAD:agent/epic16-tenant-foundation
